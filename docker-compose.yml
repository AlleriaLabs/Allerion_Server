services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: allerion-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "0"
      PING: "1"
      VERSION: "1"
      INFO: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"

  allerion-server:
    image: ${ALLERION_IMAGE:-ghcr.io/allerialabs/allerion-server:latest}
    build: .
    container_name: allerion-server
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
    pid: host
    depends_on:
      - docker-socket-proxy
    environment:
      TOKEN: ${TOKEN:?Installer must generate TOKEN in .env}
      LEGACY_TOKEN_AUTH: ${LEGACY_TOKEN_AUTH:-false}
      PORT: ${PORT:-8081}
      SPEEDTEST_MINUTES: "30"
      TZ: ${TZ:-Asia/Manila}
      DATA_DIR: "/data"
      PRICE_PER_KWH: ${PRICE_PER_KWH:-0}
      CURRENCY: ${CURRENCY:-PHP}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_ANALYTICS_INTERVAL: ${JELLYFIN_ANALYTICS_INTERVAL:-60}
      BASE_WATTS: ${BASE_WATTS:-0}
      DOCKER_API_URL: "http://127.0.0.1:2375"
      ENABLE_LAN_DISCOVERY: ${ENABLE_LAN_DISCOVERY:-1}
      SERVICE_CHECKS: ${SERVICE_CHECKS:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_FILE: /run/secrets/firebase-service-account.json
      ALERT_CPU_THRESHOLD: ${ALERT_CPU_THRESHOLD:-90}
      ALERT_RAM_THRESHOLD: ${ALERT_RAM_THRESHOLD:-90}
      ALERT_TEMP_THRESHOLD: ${ALERT_TEMP_THRESHOLD:-85}
      ALERT_DISK_THRESHOLD: ${ALERT_DISK_THRESHOLD:-92}
    volumes:
      - /:/hostfs:ro,rslave
      - ./data:/data
      - ./secrets:/run/secrets:ro
