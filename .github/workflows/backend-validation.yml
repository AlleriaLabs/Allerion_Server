name: Allerion Backend Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend and Docker deployment
    runs-on: ubuntu-latest
    env:
      TOKEN: allerion-ci-smoke-token
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python and shell syntax
        run: |
          python -m py_compile server_monitor.py auth_manager.py
          python -m unittest discover -s tests -v
          bash -n install.sh backup.sh update.sh configure.sh uninstall.sh

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build backend image for integration tests
        run: docker build --tag allerion-server:ci .

      - name: Start backend and Docker socket proxy
        run: ALLERION_IMAGE=allerion-server:ci docker compose up -d

      - name: Wait for backend health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Verify API authentication and capability discovery
        run: |
          unauthorized=$(curl --silent --output /tmp/unauthorized.json --write-out '%{http_code}' http://127.0.0.1:8081/api/capabilities)
          test "$unauthorized" = "401"
          authorized=$(curl --silent --output /tmp/capabilities.json --write-out '%{http_code}' \
            -H "X-Token: $TOKEN" http://127.0.0.1:8081/api/capabilities)
          test "$authorized" = "200"
          python -c "import json; d=json.load(open('/tmp/capabilities.json')); assert d['api_version'] == 2; assert 'features' in d"

      - name: Verify core monitoring endpoints
        run: |
          for endpoint in stats history energy; do
            code=$(curl --silent --output "/tmp/${endpoint}.json" --write-out '%{http_code}' \
              -H "X-Token: $TOKEN" "http://127.0.0.1:8081/api/${endpoint}")
            test "$code" = "200"
            python -c "import json; json.load(open('/tmp/${endpoint}.json'))"
          done

      - name: Verify optional API v2 endpoints
        run: |
          for endpoint in processes containers services network/devices network/topology network/quality energy/breakdown energy/forecast integrations; do
            code=$(curl --silent --output /tmp/endpoint.json --write-out '%{http_code}' \
              -H "X-Token: $TOKEN" "http://127.0.0.1:8081/api/${endpoint}")
            if [ "$code" != "200" ] && [ "$code" != "403" ] && [ "$code" != "503" ]; then
              echo "Unexpected HTTP $code from /api/${endpoint}"
              cat /tmp/endpoint.json
              exit 1
            fi
          done

      - name: Verify DNS and network quality response schemas
        run: |
          code=$(curl --silent --output /tmp/topology.json --write-out '%{http_code}' \
            -H "X-Token: $TOKEN" http://127.0.0.1:8081/api/network/topology)
          test "$code" = "200"
          python -c "import json; d=json.load(open('/tmp/topology.json')); assert isinstance(d.get('dns'), dict); assert isinstance(d['dns'].get('servers'), list); assert isinstance(d.get('nodes'), list); assert isinstance(d.get('links'), list); assert d.get('link_count') == len(d['links']); assert all(link.get('verified') is False for link in d['links']); assert all(link.get('source') == d.get('gateway') for link in d['links']); assert all(x.get('address') != '127.0.0.11' for x in d['dns']['servers'])"
          code=$(curl --silent --output /tmp/quality.json --write-out '%{http_code}' \
            -H "X-Token: $TOKEN" http://127.0.0.1:8081/api/network/quality)
          test "$code" = "200"
          python -c "import json; d=json.load(open('/tmp/quality.json')); assert isinstance(d.get('targets'), list); assert d.get('method') == 'ICMP echo, 3 probes per target'; assert all('packet_loss_pct' in x and 'latency_ms' in x for x in d['targets'])"

      - name: Stop backend services
        if: always()
        run: docker compose down --remove-orphans
